name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  release:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.10.0'
      - name: Prepare isolated act release destination
        if: env.ACT
        run: bash .github/testing/prepare-local-remote.sh
      - name: NuGet trusted publishing login
        if: ${{ !env.ACT }}
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Version, package and release
        id: release
        uses: cycjimmy/semantic-release-action@v8.1.3
        with:
          semantic_version: 25.0.9
          repository_url: ${{ env.ACT && 'file:///tmp/dimensional-quantities-remote.git' || '' }}
          extra_plugins: |
            @semantic-release/commit-analyzer@13.0.1
            @semantic-release/release-notes-generator@14.1.1
            @semantic-release/exec@7.1.0
            @semantic-release/github@12.0.10
            conventional-changelog-conventionalcommits@9.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      - name: Verify local release
        if: env.ACT
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.new_release_version }}
          RELEASE_PUBLISHED: ${{ steps.release.outputs.new_release_published }}
        run: python3 .github/testing/verify-local-release.py
