name: Licence compliance PR comment
on:
  workflow_run:
    workflows: [Licence compliance pilot]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: write
jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/comment-licence-results.py
