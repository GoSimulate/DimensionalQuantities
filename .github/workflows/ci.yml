name: CI
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check conventional PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 .github/scripts/check-pr-title.py
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore src/DimensionalQuantities.slnx
      - name: Build
        run: dotnet build src/DimensionalQuantities.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true
      - name: Test
        run: dotnet test --solution src/DimensionalQuantities.slnx -c Release --no-build --no-restore --report-trx --ignore-exit-code 8 --results-directory artifacts/test-results
      - name: Check NuGet package
        run: bash .github/scripts/pack.sh 0.0.0-ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && !env.ACT }}
        with:
          name: ci-results
          path: artifacts/
