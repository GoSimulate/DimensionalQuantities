name: CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      VERSION: 0.0.0-ci
      REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check conventional PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 .github/scripts/check-pr-title.py
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore src/DimensionalQuantities.slnx
      - name: Build
        run: >-
          dotnet build src/DimensionalQuantities.slnx -c Release --no-restore
          -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true -p:RepositoryUrl="$REPOSITORY_URL"
      - name: Test
        run: dotnet test --solution src/DimensionalQuantities.slnx -c Release --no-build --no-restore --report-trx --results-directory artifacts/test-results
      - name: Pack
        run: >-
          dotnet pack src/DimensionalQuantities.slnx
          -c Release --no-build --no-restore -o artifacts/packages
          -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true -p:RepositoryUrl="$REPOSITORY_URL"
      - name: Check NuGet packages
        run: python3 .github/scripts/check-package.py "$VERSION"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ci-results
          path: artifacts/
